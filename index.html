<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AppDespesas — consulta</title>
<style>
  :root {
    --page-plane: #f9f9f7; --surface-1: #fcfcfb; --text-primary: #0b0b0b;
    --text-secondary: #52514e; --text-muted: #898781; --gridline: #e1e0d9;
    --border: rgba(11,11,11,0.1); --delta-good: #006300; --delta-bad: #d03b3b;
    --series-1: #2a78d6; --series-2: #eb6834; --seq-450: #2a78d6;
    --status-good: #0ca30c; --status-warning: #fab219; --status-serious: #ec835a; --status-critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page-plane: #0d0d0d; --surface-1: #1a1a19; --text-primary: #ffffff;
      --text-secondary: #c3c2b7; --text-muted: #898781; --gridline: #2c2c2a;
      --border: rgba(255,255,255,0.1); --delta-good: #0ca30c; --delta-bad: #e66767;
      --series-1: #3987e5; --series-2: #d95926; --seq-450: #3987e5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-plane); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px; }
  .card { border: 1px solid var(--border); background: var(--surface-1); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--text-secondary); font-size: 14px; margin: 0 0 20px; }
  .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi-label { font-size: 13px; color: var(--text-secondary); }
  .kpi-value { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .barra-linha { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .barra-trilha { height: 8px; border-radius: 4px; background: var(--gridline); overflow: hidden; margin-bottom: 12px; }
  .barra-preenchida { height: 100%; border-radius: 4px; background: var(--seq-450); }
  .meta-nome { font-size: 14px; margin-bottom: 2px; }
  input[type=password] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); font-size: 15px; }
  button { width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 8px; background: var(--series-1); color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
  #erro { color: var(--delta-bad); font-size: 13px; margin-top: 8px; }
  #conteudo { display: none; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid var(--gridline); font-size: 14px; }
  li:first-child { border-top: none; }
</style>
</head>
<body>
<main>
  <div id="portao" class="card">
    <h1>AppDespesas</h1>
    <p class="sub">Retrato criptografado — digite a senha pra ver.</p>
    <input type="password" id="senha" autofocus />
    <button id="btnEntrar">Ver</button>
    <p id="erro"></p>
  </div>

  <div id="conteudo">
    <h1 id="titulo"></h1>
    <p class="sub" id="atualizado"></p>

    <div class="kpi-grid">
      <div class="card"><div class="kpi-label">Gasto do mês</div><div class="kpi-value" id="kpiTotal"></div></div>
      <div class="card"><div class="kpi-label">Fixos x variáveis</div><div class="kpi-value" id="kpiFixosVar" style="font-size:15px"></div></div>
    </div>

    <div class="card">
      <div class="kpi-label" style="margin-bottom:10px">Gasto por categoria</div>
      <div id="categorias"></div>
    </div>

    <div class="card">
      <div class="kpi-label" style="margin-bottom:10px">Metas de gasto</div>
      <div id="metas"></div>
    </div>

    <div class="card">
      <div class="kpi-label" style="margin-bottom:6px">Contas a vencer</div>
      <ul id="aVencer"></ul>
    </div>

    <div class="card">
      <div class="kpi-label" style="margin-bottom:6px">Contas vencidas</div>
      <ul id="vencidas"></ul>
    </div>
  </div>
</main>

<script>
const payload = {"salt":"jtawSLojFmo5GRsyGK+MTA==","iv":"fthNEF2PYkSK2Dyd","dados":"z4CyQlTx0Biiem56uPwmkglKSiLsFapNPxIwyN6GIM6/W17qgtDzFwdU+IonnfFSRCWN/GmEoBbRWyi5KfowdX9tLpooaeY++B4wYQkJXhlDW1DzfuQR7jDAOyNO/r4GUFKqZ1ilxPAI7Z6mEcIX49IimhjVgGjvijCpt9sTlpbHCBvSvhS/N8Gm6Fi+kBfVf3KiShonFWa7QFBkuXkb5AxWZ0I1OjE1FL2gtBU0XzebJI1Z8Q0FTnMVRgrAsWJgsZw5FJFiZlfOl5yczF7ZBtCVSSz2RfEMCpCn7XJ6sXNsd4JQVIJ+I6LfN+y3Wy+MubctoBaUMTpJE+UyITAGaM1+IvbA2HfSxSTXz+om7Qf8mAXg8jkR4NT9Iox7zlvID/SD3VRuuu+3KSbdY7OUdaE5X94p/LhDORVsfPan42C9X1OmuadxcRO/iuc//7iFHUqdcjgkoVeRDNOp07oiZHnSSfTcgqFsD5RjvRAU5vn1zDzjD5ri+zEyPD3ViAJaGPk9OnEUvHgdxTPnKEbyfj1swMKOvZzX8FK1VWThDn/S7HDZhXOGBPTTZBo/UtLihRlP7JoZPoJUhVEb0Zjo7ENr6WUOYzh4jiFUOlrHp72UgAPSigXpRPSVa5nJljXfnnMeITq2gAoCqLToGcLj2A8cm24T51vwiwHjL//c1NHM0PqqwCQFM09lprQJ+uBAPV9epqTNWlPfV3PownBIStwPYXbfIpt7z7uICjcBvHLrjZ8/XVjYXF7pzbd0rQLobkPqquEG/qSn/YDcWN14iBNlZxnciRPQj+HOecT/RxrI15xBQLvkceX/rtNcEMZ6ig6jzcOQSbZDkVWPZ9EqIfrd5ykGNEFAPqmlNjX/m/htfAJAZovPXgmJthPdU/fwUDQadiHbEP9sts4SKRmog9tfwfzkSCEyuhIXT08xyMry8EBJ2sFuiZPCiGyNfilEsDBf7bvO/ksRU95T4GpLeiLipQSPSZyYaPNCYiPR2ufhN6Efowx+aHdroXFoMYWAV4oLK0GYOIcVFxYHxWaev9I4rB/T4B5jF9Yzb3OWpLKQecGBrPHfa7TOFFEppeZwNlN5Nh5Lk0um/d33lBt3/zKbVWAkYQB715ECQ9efwp4nEA1lykWzttmyFjJnvAXDZyReYa1bQ5QlPBEcwLBKKty4bSkAIDV2T7V+cRjMtn/6U7z15KRzYd3k71K5YM4KVmdYI6ZExwUfZqGOn5GJG6g=","iteracoes":210000};

function formatarMoeda(v) {
  return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);
}

async function descriptografar(senha, payload) {
  const enc = new TextEncoder();
  const salt = Uint8Array.from(atob(payload.salt), c => c.charCodeAt(0));
  const iv = Uint8Array.from(atob(payload.iv), c => c.charCodeAt(0));
  const dados = Uint8Array.from(atob(payload.dados), c => c.charCodeAt(0));
  const chaveBase = await crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveKey']);
  const chave = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: payload.iteracoes, hash: 'SHA-256' },
    chaveBase, { name: 'AES-GCM', length: 256 }, false, ['decrypt'],
  );
  const buffer = await crypto.subtle.decrypt({ name: 'AES-GCM', iv, tagLength: 128 }, chave, dados);
  return new TextDecoder().decode(buffer);
}

function renderizar(json) {
  const { resumo, referenciaMes, geradoEm } = JSON.parse(json);
  const data = new Date(referenciaMes);
  const mesAno = data.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  document.getElementById('titulo').textContent = mesAno.charAt(0).toUpperCase() + mesAno.slice(1);
  document.getElementById('atualizado').textContent = 'Retrato gerado em ' + new Date(geradoEm).toLocaleString('pt-BR');

  document.getElementById('kpiTotal').textContent = formatarMoeda(resumo.totalMesAtual);
  document.getElementById('kpiFixosVar').textContent = formatarMoeda(resumo.totalFixos) + ' / ' + formatarMoeda(resumo.totalVariaveis);

  const maxCategoria = Math.max(1, ...resumo.gastoPorCategoria.map(c => c.valor));
  document.getElementById('categorias').innerHTML = resumo.gastoPorCategoria.map(c => `
    <div class="barra-linha"><span>${c.categoria}</span><span>${formatarMoeda(c.valor)}</span></div>
    <div class="barra-trilha"><div class="barra-preenchida" style="width:${(c.valor / maxCategoria) * 100}%"></div></div>
  `).join('') || '<p style="color:var(--text-muted);font-size:14px">Sem despesas neste mês.</p>';

  const corNivel = { OK: 'var(--status-good)', ATENCAO_70: 'var(--status-warning)', ATENCAO_90: 'var(--status-serious)', ESTOURADA: 'var(--status-critical)' };
  document.getElementById('metas').innerHTML = resumo.metas.map(m => `
    <div class="meta-nome">${m.categoriaNome} — ${formatarMoeda(m.valorGasto)} / ${formatarMoeda(m.valorLimite)}</div>
    <div class="barra-trilha"><div class="barra-preenchida" style="width:${Math.min(m.percentualUsado,100)}%;background:${corNivel[m.nivelAlerta]}"></div></div>
  `).join('') || '<p style="color:var(--text-muted);font-size:14px">Nenhuma meta definida.</p>';

  function listaContas(elId, contas) {
    const el = document.getElementById(elId);
    el.innerHTML = contas.map(c => `<li><span>${c.descricao}</span><span>${formatarMoeda(Number(c.valor))}</span></li>`).join('')
      || '<li style="border:none;color:var(--text-muted)">Nenhuma.</li>';
  }
  listaContas('aVencer', resumo.aVencer);
  listaContas('vencidas', resumo.vencidas);

  document.getElementById('portao').style.display = 'none';
  document.getElementById('conteudo').style.display = 'block';
}

document.getElementById('btnEntrar').addEventListener('click', async () => {
  const senha = document.getElementById('senha').value;
  document.getElementById('erro').textContent = '';
  try {
    const json = await descriptografar(senha, payload);
    renderizar(json);
  } catch {
    document.getElementById('erro').textContent = 'Senha incorreta.';
  }
});
document.getElementById('senha').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('btnEntrar').click();
});
</script>
</body>
</html>
